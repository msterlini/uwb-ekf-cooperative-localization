# Started by run.sh, see the README
services:
  web:
    build: .
    image: dist_project:noetic
    ports:
      - "6080:6080"
    shm_size: 1gb
    volumes:
      - ./bagfiles:/catkin_ws/src/dist_project/bagfiles
    command: vnc.sh roslaunch dist_project init.launch

  sim:
    build: .
    image: dist_project:noetic
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./bagfiles:/catkin_ws/src/dist_project/bagfiles
    command: roslaunch dist_project init.launch

  headless:
    build: .
    image: dist_project:noetic
    volumes:
      - ./bagfiles:/catkin_ws/src/dist_project/bagfiles
    command: >
      xvfb.sh timeout --signal=INT ${DURATION:-300}
      roslaunch dist_project init.launch gui:=false record:=true bag_name:=${BAG_NAME:-run}
