# Use ./run.sh, which picks the GPU override in docker/ (see the README).
# CAMERA_RATE sets the frame rate of the robot cameras (default 10 Hz).
# Desktop in the browser (any OS):   docker compose up web   ->  http://localhost:6080/vnc.html
#   everything renders on the CPU, so it shows only the live monitor with cameras at 5 Hz (GAZEBO_GUI=true adds Gazebo)
# Headless run that records a bag:   DURATION=300 BAG_NAME=my_run docker compose run --rm headless
services:
  web:
    build: .
    working_dir: /ros2_ws/src/dist_project
    image: dist_project:jazzy
    ports:
      - "6080:6080"
    environment:
      # Each mode is isolated: ROS and Gazebo discover only the processes of the same container,
      # so two simulations started together don't mix their topics
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - GZ_IP=127.0.0.1
      - GZ_PARTITION=web
    shm_size: 1gb
    volumes:
      - ./bagfiles:/ros2_ws/src/dist_project/bagfiles
    command: vnc.sh ros2 launch dist_project sim.launch.py camera_rate:=${CAMERA_RATE:-5} gazebo_gui:=${GAZEBO_GUI:-false}

  sim:
    build: .
    working_dir: /ros2_ws/src/dist_project
    image: dist_project:jazzy
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - GZ_IP=127.0.0.1
      - GZ_PARTITION=sim
    shm_size: 1gb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./bagfiles:/ros2_ws/src/dist_project/bagfiles
    command: ros2 launch dist_project sim.launch.py camera_rate:=${CAMERA_RATE:-10}

  headless:
    build: .
    working_dir: /ros2_ws/src/dist_project
    image: dist_project:jazzy
    environment:
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - GZ_IP=127.0.0.1
      - GZ_PARTITION=headless
    shm_size: 1gb
    volumes:
      - ./bagfiles:/ros2_ws/src/dist_project/bagfiles
    command: >
      xvfb.sh timeout --signal=INT ${DURATION:-300}
      ros2 launch dist_project sim.launch.py gui:=false record:=true bag_name:=${BAG_NAME:-run}
      camera_rate:=${CAMERA_RATE:-10}
